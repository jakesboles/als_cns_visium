# Fixed from the .yml you tried to build, for scripts 06b/07a/07b/08
# (06a is R, uses this repo's own R/4.4.0 + hdf5 module, not this env):
# - Added py_pcha==0.1.3 (latest on PyPI, checked directly) -- required
#   by cell2location's ArchetypalAnalysis (08_nmf.py's model), which
#   lazily imports it inside .fit() ("If you would like to use this
#   function please first run `pip install py_pcha`" -- its own source's
#   words). Missing entirely from the original list, so 08_nmf.py would
#   have failed with ModuleNotFoundError partway through, after already
#   loading the (potentially large) Visium h5ad.
# - Added --extra-index-url for the pinned torch==1.13.1+cu117/
#   torchvision==0.14.1+cu117/torchaudio==0.13.1+cu117 builds -- PyPI
#   itself doesn't host these +cu117 local-version wheels, only
#   download.pytorch.org does, so a fresh `conda env create -f` on this
#   file without the index line would fail to resolve those three
#   versions at all. Everything else is unchanged from what you built.
